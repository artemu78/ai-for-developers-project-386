AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Call Calendar Node.js backend

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 5
    MemorySize: 128
    Architectures:
      - arm64

Resources:
  CallCalendarApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, OPTIONS]

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref CallCalendarApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Public URL of the Call Calendar API
    Value: !Sub 'https://${CallCalendarApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
